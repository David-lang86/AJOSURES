version: '3.9'

services:

  postgres:

    image: postgres:16

    container_name: ajosures_postgres

    environment:

      POSTGRES_DB: ${DB_NAME}

      POSTGRES_USER: ${DB_USERNAME}

      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:

      - "${DB_PORT}:5432"

  backend:

    build: ./backend/backend

    container_name: ajosures_backend

    ports:

      - "8080:8080"

    environment:

      DB_HOST: postgres

      DB_PORT: 5432

      DB_NAME: ${DB_NAME}

      DB_USERNAME: ${DB_USERNAME}

      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:

      - postgres

  frontend:

    build: ./frontend

    container_name: ajosures_frontend

    ports:

      - "5173:5173"

    depends_on:

      - backend